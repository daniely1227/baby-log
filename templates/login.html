{% extends "base.html" %}
{% block title %}Log in · Run Log{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Log in</h1>
  <form method="post" novalidate>
    <label>Email
      <input type="email" name="email" value="{{ request.form.email }}" autocomplete="email">
    </label>
    <label>Password
      <input type="password" name="password" autocomplete="current-password">
    </label>
    <button class="btn" type="submit">Log in</button>
  </form>
  <p class="muted">New here? <a href="{{ url_for('signup') }}">Create an account</a></p>
</section>
{% endblock %}
